<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDiary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1/lib/addons/p5.min.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="left"></div>
    <div class="center">
      <div id="wrapper">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
          <div class="container-fluid">
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href=" ">Home</a >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#messageList">Diary</a >
                  <a class="nav-link" href="#thanks">Thanks</a >
                </li>
              </ul>
              <form class="d-flex" role="search">
                <input id="searchInput" class="form-control me-2" type="search" placeholder="Search thoughts" aria-label="Search">
                <button class="btn btn-outline-success" type="button" id="searchBtn">Search</button>
              </form>
            </div>
          </div>
        </nav>

        <div class="card" id="intro">
          <div class="card-body">
            <h5 class="card-title">Home page</h5>
          </div>
          <img src="https://picsum.photos/id/237/600/300" class="card-img-bottom" alt="Sample image">
        </div>

        <div class="mt-4">
          <h4>Diary</h4>
          <div id="messageList" class="message-list"></div>
        </div>

        <div id="thanks" class="card mt-3 p-3">Thanks for watching this website</div>
      </div>
    </div>
    <div class="right"></div>
  </div>

  <div class="input-bar">
    <textarea id="msgInput" placeholder="Write your thought here..." rows="2"></textarea>
    <button id="sendBtn" class="btn btn-primary">Submit</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
